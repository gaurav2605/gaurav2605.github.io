<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Kumar Pandey — Finance, Analytics & Operations</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['"Newsreader"', 'Georgia', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        paper: '#FAF8F5',
                        surface: '#FFFFFF',
                        ink: '#141413',
                        muted: '#575653',
                        borderWarm: '#E6E4DD',
                        accent: '#1E3A2F',
                        accentLight: '#EAF0EC'
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #FAF8F5; 
            color: #141413; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .editorial-card {
            background: #FFFFFF;
            border: 1px solid #E6E4DD;
            box-shadow: 0 1px 3px rgba(20, 20, 19, 0.03);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        .editorial-card:hover {
            border-color: #C7C4B8;
            box-shadow: 0 10px 30px -10px rgba(20, 20, 19, 0.07);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FAF8F5; }
        ::-webkit-scrollbar-thumb { background: #D5D2C8; border-radius: 3px; }
    </style>
</head>
<body x-data="portfolioCore()" class="min-h-screen relative selection:bg-ink selection:text-paper">

    <!-- Top Navigation Bar -->
    <header class="w-full border-b border-borderWarm sticky top-0 z-40 bg-paper/90 backdrop-blur-md">
        <div class="max-w-6xl mx-auto h-16 px-6 flex items-center justify-between text-xs">
            <a href="#about" class="font-serif text-lg font-medium tracking-tight text-ink hover:opacity-75 transition-opacity">
                Gaurav Kumar Pandey
            </a>
            
            <div class="hidden md:flex space-x-8 items-center text-[13px] font-medium text-muted">
                <a href="#experience" class="hover:text-ink transition-colors" x-text="lang === 'en' ? 'Experience' : 'Erfahrung'"></a>
                <a href="#projects" class="hover:text-ink transition-colors" x-text="lang === 'en' ? 'Selected Work' : 'Projekte'"></a>
                <a href="#certifications" class="hover:text-ink transition-colors" x-text="lang === 'en' ? 'Credentials' : 'Zertifikate'"></a>
                <a href="#education" class="hover:text-ink transition-colors" x-text="lang === 'en' ? 'Education' : 'Ausbildung'"></a>
                <a href="#skills" class="hover:text-ink transition-colors" x-text="lang === 'en' ? 'Skills' : 'Skills'"></a>
                <a href="#contact" class="hover:text-ink transition-colors" x-text="lang === 'en' ? 'Contact' : 'Kontakt'"></a>
                
                <div class="flex items-center border border-borderWarm rounded-md p-0.5 bg-white text-[11px] font-mono">
                    <button @click="lang = 'en'" class="px-2 py-0.5 rounded-xs transition-all" :class="lang === 'en' ? 'bg-ink text-white font-medium' : 'text-muted hover:text-ink'">EN</button>
                    <button @click="lang = 'de'" class="px-2 py-0.5 rounded-xs transition-all" :class="lang === 'de' ? 'bg-ink text-white font-medium' : 'text-muted hover:text-ink'">DE</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 pt-12 pb-20 space-y-16">

        <!-- HERO SECTION -->
        <section id="about" class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start pt-2">
